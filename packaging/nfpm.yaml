name: deepfinder
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Xen0rInspire
description: A low level Rust tool to find duplicates in large directories.
homepage: https://github.com/XenorInspire/WorgenX
license: GPL-3.0-only
depends:
  - libc6 (>= 2.34)
  - libgcc-s1

contents:
  - src: /tmp/deepfinder
    dst: /usr/bin/deepfinder
    file_info:
      mode: 0755
  - src: /workspace/LICENSE
    dst: /usr/share/licenses/deepfinder/LICENSE
    file_info:
      mode: 0644
  - src: /workspace/README.md
    dst: /usr/share/doc/deepfinder/README
    file_info:
      mode: 0644
  - src: /workspace/resources/usr/share/doc/deepfinder/AUTHORS
    dst: /usr/share/doc/deepfinder/AUTHORS
    file_info:
      mode: 0644
  - src: /workspace/resources/usr/share/doc/deepfinder/copyright
    dst: /usr/share/doc/deepfinder/copyright
    file_info:
      mode: 0644
  - src: /tmp/deepfinder-package-resources/usr/share/doc/deepfinder/changelog.gz
    dst: /usr/share/doc/deepfinder/changelog.gz
    file_info:
      mode: 0644
  - src: /tmp/deepfinder-package-resources/usr/share/man/man1/deepfinder.1.gz
    dst: /usr/share/man/man1/deepfinder.1.gz
    file_info:
      mode: 0644

overrides:
  rpm:
    depends:
      - glibc >= 2.34
      - libgcc