[package]
name = "deepfinder"
version = "0.1.1"
edition = "2024"
authors = ["Xen0rInspire"]
license = "MIT"
description = "A low level Rust tool to find duplicates in large directories."
keywords = ["deepfinder", "duplicate", "finder", "hash", "file", "directory"]

[dependencies]
clap = { version = "4.6.0", features = ["std"], default-features = false }
num_cpus = { version = "1.17.0", default-features = false }
serde_json = { version = "1.0.149", features = ["std"], default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
csv = { version = "1.4.0", default-features = false }
serde-xml-rs = { version = "0.8.1", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
digest = { version = "0.11.2", default-features = false }
hex = { version = "0.4.3", features = ["alloc"], default-features = false }
sha3 = { version = "0.11.0", default-features = false }
blake2 = { version = "0.11.0-rc.5", default-features = false }
whirlpool = { version = "0.11.0", default-features = false }
